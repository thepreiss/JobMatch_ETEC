# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "expo" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "react" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "prettier" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "unimodules" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "axios" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "fetch" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"

      - package-ecosystem: "typescript" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
